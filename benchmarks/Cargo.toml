[package]
name = "rill-subscriptions-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
rill-subscriptions = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
differential-dataflow = { version = "=0.25.1", optional = true }
datafrog = { version = "=2.0.1", optional = true }
ascent = { version = "=0.8.1", optional = true }
crepe = { version = "=0.2.0", optional = true }
salsa = { version = "=0.28.5", optional = true }
incremental = { version = "=0.2.8", optional = true }
reactive_graph = { version = "=0.2.16", optional = true }
sycamore-reactive = { version = "=0.9.4", optional = true }
floem_reactive = { version = "=0.2.0", optional = true }
futures-signals = { version = "=0.3.34", optional = true }
rstar = { version = "=0.13.0", optional = true }
roaring = { version = "=0.11.5", optional = true }
bitvec = { version = "=1.1.1", optional = true }
fixedbitset = { version = "=0.5.7", optional = true }
bit-set = { version = "=0.11.1", optional = true }
hibitset = { version = "=0.6.4", optional = true }
rangemap = { version = "=1.8.0", optional = true }
intervaltree = { version = "=0.2.7", optional = true }

timely = { version = "=0.31.0", optional = true }

adapton = { version = "=0.3.31", optional = true }
depends = { version = "=0.11.0", optional = true }
incr-compute = { version = "=0.1.0", optional = true }
anchors = { version = "=0.6.0", optional = true }
rxrust = { version = "=0.15.0", optional = true }
carboxyl = { version = "=0.2.2", optional = true }
sodium-rust = { version = "=2.1.3", optional = true }
frappe = { version = "=0.4.7", optional = true }
leptos_reactive = { version = "=0.6.15", optional = true }
concoct = { version = "=0.18.0", optional = true }
dioxus-signals = { version = "=0.7.10", optional = true }

[features]
default = []
differential_dataflow = ["dep:differential-dataflow", "dep:timely"]
datafrog = ["dep:datafrog"]
ascent = ["dep:ascent"]
crepe = ["dep:crepe"]
roaring = ["dep:roaring"]
rstar = ["dep:rstar"]
bitvec = ["dep:bitvec"]
fixedbitset = ["dep:fixedbitset"]
bit_set = ["dep:bit-set"]
hibitset = ["dep:hibitset"]
rangemap = ["dep:rangemap"]
intervaltree = ["dep:intervaltree"]
incremental = ["dep:incremental"]
futures_signals = ["dep:futures-signals"]
salsa = ["dep:salsa"]
sycamore_reactive = ["dep:sycamore-reactive"]
floem_reactive = ["dep:floem_reactive"]
reactive_graph = ["dep:reactive_graph"]

adapton = ["dep:adapton"]
depends = ["dep:depends"]
incr_compute = ["dep:incr-compute"]
anchors = ["dep:anchors"]
rxrust = ["dep:rxrust"]
carboxyl = ["dep:carboxyl"]
sodium_rust = ["dep:sodium-rust"]
frappe = ["dep:frappe"]
leptos_reactive = ["dep:leptos_reactive"]
concoct = ["dep:concoct"]
dioxus_signals = ["dep:dioxus-signals"]
