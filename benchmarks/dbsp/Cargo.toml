[package]
name = "rill-subscriptions-dbsp-comparison"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[[bin]]
name = "rill-subscriptions-dbsp-comparison"
path = "../src/main.rs"
[dependencies]
rill-subscriptions = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dbsp = { version = "=0.367.0", default-features = false }
[features]
default = ["dbsp"]
dbsp = []
allocation_audit = []
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
incremental = false
lto = "thin"
codegen-units = 1
[lints.rust]
unexpected_cfgs = "allow"
